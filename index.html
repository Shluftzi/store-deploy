<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shluftzi Store Deployment — Projects Manager for Apple App Store and Google Play pipeline status">
  <meta name="color-scheme" content="light">
  <title>Projects Manager — Store Deploy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="toolbar" role="banner">
      <div class="toolbar-leading">
        <span class="toolbar-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
            <rect x="12" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.55"/>
            <rect x="2" y="12" width="8" height="8" rx="2" fill="currentColor" opacity="0.55"/>
            <rect x="12" y="12" width="8" height="8" rx="2" fill="currentColor" opacity="0.35"/>
          </svg>
        </span>
        <div class="toolbar-titles">
          <span class="toolbar-subtitle">Projects Manager</span>
          <h1 class="toolbar-title">Store Deploy</h1>
        </div>
      </div>
      <div class="toolbar-trailing">
        <button type="button" class="toolbar-btn" onclick="showSettings()" title="API Settings">
          <span class="btn-icon" aria-hidden="true">&#9881;</span>
          <span class="btn-label">Settings</span>
        </button>
        <a class="toolbar-btn"
           href="https://app.notion.com/p/3e81b15ab1d0811592d6e10e59361d9b"
           target="_blank" rel="noopener noreferrer"
           title="Open Notion project page">
          <span class="btn-icon" aria-hidden="true">&#128196;</span>
          <span class="btn-label">Notion</span>
        </a>
      </div>
    </header>

    <div class="split-view">
      <aside class="sidebar" id="sidebar" aria-label="Projects">
        <div class="sidebar-header">
          <h2 class="sidebar-section-title">Projects</h2>
        </div>
        <nav class="sidebar-list" role="listbox" aria-label="Project list">
          <button type="button" class="sidebar-row is-selected" role="option" aria-selected="true"
                  data-id="shell" id="row-shell">
            <span class="row-icon" aria-hidden="true">&#128026;</span>
            <span class="row-content">
              <span class="row-title">Shell <span class="row-priority">P0</span></span>
              <span class="row-subtitle">Prep &middot; NO-GO</span>
            </span>
            <span class="row-badge badge-nogo">NO-GO</span>
          </button>
          <button type="button" class="sidebar-row" role="option" aria-selected="false"
                  data-id="bake" id="row-bake">
            <span class="row-icon" aria-hidden="true">&#129473;</span>
            <span class="row-content">
              <span class="row-title">Bake</span>
              <span class="row-subtitle">Prep &middot; NO-GO</span>
            </span>
            <span class="row-badge badge-nogo">NO-GO</span>
          </button>
          <button type="button" class="sidebar-row" role="option" aria-selected="false"
                  data-id="prompt" id="row-prompt">
            <span class="row-icon" aria-hidden="true">&#128172;</span>
            <span class="row-content">
              <span class="row-title">Prompt</span>
              <span class="row-subtitle">Prep &middot; NO-GO</span>
            </span>
            <span class="row-badge badge-nogo">NO-GO</span>
          </button>
          <button type="button" class="sidebar-row" role="option" aria-selected="false"
                  data-id="puk" id="row-puk">
            <span class="row-icon" aria-hidden="true">&#129439;</span>
            <span class="row-content">
              <span class="row-title">Puk</span>
              <span class="row-subtitle">Windows &middot; Skipped</span>
            </span>
            <span class="row-badge badge-skipped">Skipped</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-header">
          <h2 class="sidebar-section-title">Reference</h2>
        </div>
        <nav class="sidebar-list" role="listbox" aria-label="Reference">
          <button type="button" class="sidebar-row" role="option" aria-selected="false"
                  data-id="process" id="row-process">
            <span class="row-icon" aria-hidden="true">&#128203;</span>
            <span class="row-content">
              <span class="row-title">Process</span>
              <span class="row-subtitle">6-stage pipeline &amp; checklists</span>
            </span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <p><span class="conn-dot ok" id="conn-dot"></span> API connected</p>
          <p>Release / QA owns GO / NO-GO</p>
        </div>
      </aside>

      <main class="detail" id="detail" aria-live="polite">
        <div class="detail-empty">
          <span class="detail-empty-icon">&#128640;</span>
          <span class="detail-empty-text">Loading&hellip;</span>
        </div>
      </main>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
